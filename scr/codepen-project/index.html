<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progetto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"

    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="container">

      <main>

                <div

                </div>
              </div>
              <div class="pageHeader border-bottom">
                <div class="logo text-center crm-logo" style="cursor: pointer">
                  
                </div>
                <div class="title-container">

                    <a href="/"
                      ><img
                        src="/public/images/bc-home.gif"

                    ><img
                      src="/public/images/bc-separator.gif"

                    /><a class="text-dark" href="/scheda">Schede aziendali</a
                    ><img
                      src="/public/images/bc-separator.gif"
                      alt="home"
                      class="ms-2 me-2"

                    >
                  </div>
                  <div class="title">Scheda azienda</div>
                  <div class="subtitle"><div class="fs-xs">&nbsp;</div></div>
                </div>
              </div>
            </div>
          </header>
          <div class="d-flex">
            <aside class="bg-darker-custom text-white" style="top: 161px">
              <div class="left-menu left-menu-mini">
                <ul>
                  <li class="link">
                    <label
                      ><i class="ms-Icon ms-Icon--WaffleOffice365"></i
                    ></label>
                  </li>
                  <li title="Home" class="link">
                    <label><i class="ms-Icon ms-Icon--Home"></i></label>
                  </li>
                  <li title="Schede aziendali" class="bg-white text-darker">

                  </li>
                  <li title="Relazioni area manager" class="link">
                    <label

                  <li title="Obiettivi commerciali" class="link">

                  </li>
                  <li title="Riunioni commerciali" class="link">
                    <label><i class="ms-Icon ms-Icon--Group"></i></label>
                  </li>
                  <li title="Analisi di zona" class="link">

                      ><i class="ms-Icon ms-Icon--MapDirections"></i
                    ></label>
                  </li>
                  <li title="Redditività stand" class="link">

                  <li title="Relazioni agenti" class="link">

                  </li>
                  <li title="Stores" class="link">

                  </li>
                  <li title="Valutazione punti vendita" class="link">

                    font-size: 1.3rem;
                    line-height: 1rem;

                    <span class="text">Schede aziendali</span>
                  </div>
                  <div>
                    <div class="left-nav-menu-item">
                      <a class="d-flex" href="/scheda/cliente"

                      <a class="d-flex" href="/scheda/agente"

                    <div class="left-nav-menu-item">
                      <a class="d-flex" href="/scheda/azienda"

                        style="min-width: 80px"
                      >
                        <span class="k-button-text"
                          ><i
                            class="ms-Icon ms-Icon--ChromeBack fs-xl text-dark"
                            aria-hidden="true"
                          ></i>
                          <div class="d-none d-md-block">
                            Indietro <br /><br /></div
                        ></span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
